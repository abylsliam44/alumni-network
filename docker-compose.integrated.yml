# Development overlay: combines the full platform with MongoDB project features.
# Use with: docker compose -f docker-compose.yml -f docker-compose.integrated.yml up -d --build
name: alumni-full-demo
services:
  postgres:
    container_name: alumni-full-postgres
    ports: !override
      - "127.0.0.1:5543:5432"
  mongodb:
    image: mongo:7.0
    container_name: alumni-full-mongodb
    command: ["mongod", "--replSet", "rsintegrated", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - integrated_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rsintegrated\", members: [{_id: 0, host: \"mongodb:27017\"}]}); 0 }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  backend:
    build:
      dockerfile: Dockerfile.integrated
    ports: !override
      - "127.0.0.1:8010:8000"
    container_name: alumni-full-backend
    environment:
      INTEGRATED_PROJECTS_MODE: "true"
      MONGODB_URI: "mongodb://mongodb:27017/?replicaSet=rsintegrated"
      MONGODB_DATABASE: alumni_integrated
    depends_on:
      mongodb:
        condition: service_healthy
  frontend:
    ports: !override
      - "127.0.0.1:3030:3000"
    container_name: alumni-full-frontend
    environment:
      VITE_INTEGRATED_PROJECTS_MODE: "true"
      VITE_ACADEMIC_NOSQL_MODE: "false"
  celery-worker:
    build:
      dockerfile: Dockerfile.integrated
    container_name: alumni-full-celery-worker
  celery-beat:
    build:
      dockerfile: Dockerfile.integrated
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    container_name: alumni-full-celery-beat
  qdrant:
    ports: !override
      - "127.0.0.1:6333:6333"
    container_name: alumni-full-qdrant
  redis-cache:
    container_name: alumni-full-redis-cache
  redis-celery:
    container_name: alumni-full-redis-celery
  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    container_name: alumni-full-minio
  agent:
    profiles: ["optional-agent"]
volumes:
  integrated_mongo_data:
